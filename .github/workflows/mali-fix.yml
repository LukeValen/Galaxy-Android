name: Build Mali character fix
on:
  workflow_dispatch:
  push:
    branches: [fix/mali-character-materials]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true
      - run: |
          cmake -S . -B build-mobile -G Ninja -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DTARGET_MOBILE=ON -DCMAKE_BUILD_TYPE=Release
          ninja -C build-mobile -j4 game main reserve installer
          python3 package_mobile_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: galaxy-mali-character-fix
          path: |
            out-mobile/GalaxyAndroid.apk
            build-mobile/libgame.so
